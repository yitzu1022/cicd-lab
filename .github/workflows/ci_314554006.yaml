name: CI for 314554006

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  checks: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Prettier format check
        run: npm run format:check

      - name: Run tests and generate JUnit report
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml

      - name: Publish test report to GitHub Actions UI
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: vitest
          path: reports/vitest-junit.xml
          reporter: junit
          fail-on-error: true

      - name: Upload test report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-test-report
          path: reports/
          if-no-files-found: error
